<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мини-Викторина и Портфолио</title>
    <style>
        :root {
            --primary: #4a90e2;
            --bg: #f4f7f6;
        }
        body { 
            font-family: sans-serif; 
            background: var(--bg); 
            display: flex; 
            flex-direction: column; /* Элементы теперь идут друг под другом */
            align-items: center; 
            margin: 0; 
            padding: 20px;
        }
        
        /* Стили квиза */
        #quiz-container { 
            background: white; 
            padding: 2rem; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 500px; 
            text-align: center; 
            margin-bottom: 50px; /* Отступ до портфолио */
        }
        .btn { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin: 5px; font-size: 1rem; transition: 0.3s; }
        .btn:hover { opacity: 0.8; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .hidden { display: none; }

        /* Стили портфолио */
        .portfolio-section {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }
        .video-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
            align-items: center;
        }
        .video-item {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
        }
        video {
            width: 100%;
            border-radius: 8px;
            outline: none;
        }
    </style>
</head>
<body>

<div id="quiz-container">
    <div id="question-screen">
        <h2 id="question-text">Загрузка вопроса...</h2>
        <div id="options-container" class="options"></div>
    </div>
    <div id="result-screen" class="hidden">
        <h2>Викторина окончена!</h2>
        <p id="score-text"></p>
        <button class="btn" onclick="location.reload()">Начать заново</button>
    </div>
</div>

<hr style="width: 100%; max-width: 800px; border: 0; height: 1px; background: #ccc; margin-bottom: 50px;">

<section id="portfolio" class="portfolio-section">
    <h2>Мое Портфолио</h2>
    <div class="video-container">
        
        <div class="video-item">
    <h3>Моя работа №1</h3>
    <video controls>
        <source src="my-video.mp4" type="video/mp4">
        Ваш браузер не поддерживает видео.
    </video>
</div>

    </div>
</section>

<script>
    const quizData = [
        { q: "Какой язык программирования создал Брендан Эйх?", a: ["Java", "Python", "JavaScript", "C++"], correct: 2 },
        { q: "Что означает HTML?", a: ["HyperText Markup Language", "High Tech Modern Language", "Hyperlink Text Mode"], correct: 0 },
        { q: "Какой тег используется для вставки изображения?", a: ["<link>", "<img>", "<a>", "<picture>"], correct: 1 }
    ];

    let currentQuestion = 0;
    let score = 0;

    function loadQuestion() {
        const q = quizData[currentQuestion];
        document.getElementById("question-text").innerText = q.q;
        const container = document.getElementById("options-container");
        container.innerHTML = "";
        
        q.a.forEach((option, index) => {
            const btn = document.createElement("button");
            btn.innerText = option;
            btn.className = "btn";
            btn.onclick = () => checkAnswer(index);
            container.appendChild(btn);
        });
    }

    function checkAnswer(index) {
        if (index === quizData[currentQuestion].correct) score++;
        currentQuestion++;
        if (currentQuestion < quizData.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById("question-screen").classList.add("hidden");
        document.getElementById("result-screen").classList.remove("hidden");
        document.getElementById("score-text").innerText = `Ваш результат: ${score} из ${quizData.length}`;
    }

    loadQuestion();
</script>

</body>
</html>
